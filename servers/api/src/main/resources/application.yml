# 환경변수는 루트 .env.* 에서 읽는다. (Gradle bootRun 은 FMS_ENV_FILE, 도커는 env_file)
# 값이 없을 때 기동을 멈춰야 하는 변수는 기본값 없이 ${NAME} 으로 적는다.
server:
  port: ${API_PORT}
  # 프록시 헤더는 TrustedProxyFilter 가 API_TRUST_PROXY 기준으로 직접 해석한다.
  forward-headers-strategy: none
  error:
    whitelabel:
      enabled: false
spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 database-manager(Flyway)만 바꾼다. api 는 엔티티와 스키마가 맞는지만 확인한다.
      ddl-auto: validate
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:1024}MB
      max-request-size: -1
      file-size-threshold: 0
      # 인증 · 권한 검사(인터셉터)를 통과한 뒤에 파일을 받는다.
      resolve-lazily: true
  jackson:
    # 원본(zod) 처럼 타입이 다른 값을 바꿔 받지 않는다. ("5" → 5, 1.5 → 1 등)
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-null-for-primitives: true
  mvc:
    problemdetails:
      enabled: false
  # devtools 는 yarn java:api:local(:watch) 에서만 classpath 에 들어간다. (servers/api/build.gradle.kts)
  devtools:
    # 개발용 기본 속성(에러 응답의 stacktrace 등)을 넣지 않는다. 응답이 운영 · e2e 와 같아야 한다.
    add-properties: false
    # api 는 브라우저 새로고침이 필요 없다.
    livereload:
      enabled: false
fms:
  api:
    admin-access-token-secret: ${JWT_SECRET_ADMIN_ACCOUNT}
    admin-short-time-token-secret: ${JWT_SECRET_ADMIN_SHORT_TIME}
    share-link-unlock-token-secret: ${JWT_SECRET_SHARE_LINK_UNLOCK}
    cors-origins: ${API_CORS_ORIGINS:}
    trust-proxy: ${API_TRUST_PROXY:}
    refresh-token-days: ${ADMIN_REFRESH_TOKEN_DAYS:14}
    admin-refresh-token-reuse-grace-seconds: ${ADMIN_REFRESH_TOKEN_REUSE_GRACE_SECONDS:30}
    share-link-unlock-expires-in-seconds: ${SHARE_LINK_UNLOCK_EXPIRES_IN_SECONDS:600}
    cookie-domain: ${COOKIE_DOMAIN:}
    secure-cookie: ${API_SECURE_COOKIE:false}
    user-web-origin: ${USER_WEB_ORIGIN:http://localhost:3001}
    storage-dir: ${STORAGE_DIR}
logging:
  level:
    root: warn
    com.fms: info
    org.springframework.boot.web.embedded: info
