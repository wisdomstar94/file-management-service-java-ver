# 환경변수(DB_*)는 루트 .env.* 에서 읽는다. (Gradle bootRun 은 FMS_ENV_FILE, 도커는 env_file)
spring:
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 만 바꾼다. migrate 전에는 테이블이 없을 수 있어 검증도 하지 않는다.
      ddl-auto: none
logging:
  level:
    root: warn
    com.fms: info
    org.flywaydb: info
fms:
  seed:
    initial-admin-id: ${INITIAL_ADMIN_ID:}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}
    initial-admin-nickname: ${INITIAL_ADMIN_NICKNAME:}
